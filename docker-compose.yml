services:
  api-gateway:
    container_name: api-gateway
    build:
      context: ./api-gateaway
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./environment/shared/shared.env
    secrets:
      - jwt_public_key

  user-service:
    container_name: user-service
    build:
      context: ./users
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./environment/shared/shared.env
    secrets:
      - jwt_public_key

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_running']
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  rabbitmq_data:

secrets:
  jwt_public_key:
    file: ./keys/public.key
